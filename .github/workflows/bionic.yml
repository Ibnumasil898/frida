
name: Build Frida Bionic arm64
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential libssl-dev libffi-dev
          pip3 install meson==1.3.2 ninja

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Install NDK r26c
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          mv android-ndk-r26c $HOME/android-ndk-r26c

      - name: Ensure submodules
        run: python3 tools/ensure-submodules.py

      - name: Configure Frida for Android ARM64
        run: |
          source "$HOME/.cargo/env"
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r26c
          export FRIDA_PREFIX=$PWD/build/install
          ./configure \
            --prefix="$FRIDA_PREFIX" \
            --enable-gadget \
            --enable-server \
            --enable-portal \
            --enable-inject \
            --disable-frida-tools \
            -- \
            -Dfrida-gum:devkits=gum,gumjs \
            -Dfrida-core:devkits=core

      - name: Build
        run: |
          source "$HOME/.cargo/env"
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r26c
          make -j$(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p out
          BIN=$(find build -name "frida-server" -type f | head -n1)
          file "$BIN"
          cp "$BIN" out/frida-server-android-arm64-bionic
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-arm64-bionic
          path: out/frida-server-android-arm64-bionic
