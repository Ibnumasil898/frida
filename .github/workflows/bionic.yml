name: Build Frida Bionic arm64
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ninja-build
          pip3 install meson

      - name: Configure for Android ARM64 Bionic
        run: |
          python3 tools/ensure-submodules.py
          ./configure --host=android-arm64 --enable-server

      - name: Build
        run: |
          make -j$(nproc)
          echo "--- CHECK FILE ---"
          find build -name "frida-server" -type f -exec file {} \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-arm64-bionic
          path: |
            build/frida-server/android-arm64/frida-server
            build/**/frida-server
