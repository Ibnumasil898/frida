name: Build Frida Bionic arm64
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ninja-build unzip
          pip3 install meson

      - name: Install NDK r29
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          mv android-ndk-r29 $HOME/android-ndk-r29
          echo "NDK_ROOT=$HOME/android-ndk-r29" >> $GITHUB_ENV

      - name: Configure for Android ARM64 Bionic
        run: |
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r29
          python3 tools/ensure-submodules.py
          ./configure --host=android-arm64 --enable-server

      - name: Build
        run: |
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r29
          make -j$(nproc)
          echo "--- CHECK FILE ---"
          find build -name "frida-server" -type f -exec file {} \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-arm64-bionic
          path: |
            build/frida-server/android-arm64/frida-server
            build/**/frida-server
