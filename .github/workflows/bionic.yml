name: Build Frida Bionic arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Frida
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Verify source and submodules
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== GIT ==="
          git describe --tags --always --long
          git status --short
          git log -1 --format='%H%n%ad%n%D' --date=iso

          echo
          echo "=== SUBMODULES ==="
          git submodule status --recursive

          echo
          echo "=== FRIDA VERSION GENERATOR ==="
          test -f releng/frida_version.py
          python3 releng/frida_version.py

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            ninja-build \
            unzip \
            wget \
            file \
            binutils

          python3 -m pip install --user meson

      - name: Install NDK r29
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip

          unzip -q android-ndk-r29-linux.zip

          mv android-ndk-r29 "$HOME/android-ndk-r29"

          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r29" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$HOME/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Prepare Frida submodules
        shell: bash
        run: |
          set -euxo pipefail

          python3 tools/ensure-submodules.py

          echo
          echo "=== SUBMODULE STATUS AFTER PREPARATION ==="
          git submodule status --recursive

          echo
          echo "=== VERSION AFTER PREPARATION ==="
          python3 releng/frida_version.py

      - name: Configure Android ARM64 Bionic
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$HOME/android-ndk-r29"
          export NDK_ROOT="$HOME/android-ndk-r29"

          ./configure \
            --host=android-arm64 \
            --enable-server

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_ROOT="$HOME/android-ndk-r29"
          export NDK_ROOT="$HOME/android-ndk-r29"

          make -j"$(nproc)"

      - name: Verify frida-server
        shell: bash
        run: |
          set -euxo pipefail

          SERVER="$(find build -type f -name 'frida-server' | head -n1)"

          test -n "$SERVER"
          test -f "$SERVER"

          echo "=== SERVER ==="
          echo "$SERVER"

          echo
          echo "=== FILE ==="
          file "$SERVER"

          echo
          echo "=== VERSION ==="
          "$SERVER" --version

          echo
          echo "=== SIZE ==="
          ls -lh "$SERVER"
          stat -c '%n %s bytes' "$SERVER"

          echo
          echo "=== INTERPRETER ==="
          readelf -l "$SERVER" | \
            grep 'Requesting program interpreter'

          echo
          echo "=== NEEDED ==="
          readelf -d "$SERVER" | grep NEEDED

          echo
          echo "=== SHA256 ==="
          sha256sum "$SERVER"

      - name: Upload frida-server
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-arm64-bionic
          path: build/**/frida-server
          if-no-files-found: error
