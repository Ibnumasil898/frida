name: Build Frida Bionic arm64
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Frida
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential libssl-dev libffi-dev
          pip3 install meson==1.3.2 ninja

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Rust Android arm64 target
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK r26c
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          mv android-ndk-r26c $HOME/android-ndk-r26c
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r26c" >> $GITHUB_ENV

      - name: Build Frida Android arm64 Bionic
        run: |
          source "$HOME/.cargo/env"
          export ANDROID_NDK_ROOT=$HOME/android-ndk-r26c
          # ini yang bener buat Bionic arm64
          make core-android-arm64 -j$(nproc)

      - name: Locate frida-server
        run: |
          find build -name "frida-server" -type f | tee /tmp/files.txt
          ls -lh $(cat /tmp/files.txt | head -n1)

      - name: Check architecture
        run: file $(find build -name "frida-server" | head -n1)

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp $(find build -name "frida-server" | head -n1) out/frida-server-android-arm64-bionic
          chmod +x out/frida-server-android-arm64-bionic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-android-arm64-bionic
          path: out/frida-server-android-arm64-bionic
